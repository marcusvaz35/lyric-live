<!DOCTYPE html>
<html lang="pt-BR" style="background: #000">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: lyricmedia:; media-src 'self' blob: lyricmedia:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Lyric Live — LIVE</title>
    <!-- fundo preto desde o primeiro quadro: sem isso o tema claro do editor pinta a janela de branco antes do React montar -->
    <style>
      html,
      body,
      #root {
        background: #000 !important;
        margin: 0;
      }
      /* o conteúdo entra vindo do preto; o fundo já é preto desde o primeiro quadro */
      #root {
        animation: live-in 320ms ease both;
      }
      @keyframes live-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* some antes da janela fechar (o main põe esta classe e espera a transição) */
      html.live-leaving #root {
        opacity: 0;
        transition: opacity 260ms ease;
        animation: none;
      }
    </style>
  </head>
  <body style="background: #000">
    <div id="root"></div>
    <script type="module" src="/src/live.tsx"></script>
  </body>
</html>
